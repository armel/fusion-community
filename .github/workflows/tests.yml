name: Tests

on:
  push:
    paths: ["tools/**", "tests/**", ".github/**"]
  pull_request:
    paths: ["tools/**", "tests/**", ".github/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet -r tools/requirements.txt
      - run: python -m unittest discover -s tests -v
