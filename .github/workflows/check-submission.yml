name: Check app submission

# Runs from the default branch on every submission issue: the issue only brings
# data (form fields and two attachments), never code that runs here.
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: check-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.issue.state == 'open' && contains(github.event.issue.body, '### App binary')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet -r tools/requirements.txt
      # The issue is read from the event file, never interpolated into the shell.
      - run: python tools/check_submission.py --event "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
